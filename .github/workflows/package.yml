name: Windows unsigned packages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-packages-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: pwsh
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Independent Server without DM
        run: pnpm package:server --platform=windows --arch=amd64
      - name: Pure client
        run: pnpm package:client --server=none --target=x86_64-pc-windows-msvc
      - name: Bundled client without DM
        run: pnpm package:client --server=bundled --target=x86_64-pc-windows-msvc
      - name: Verify versions, capability boundaries and file hashes
        run: node scripts/verify-windows-packages.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-unsigned-${{ github.sha }}
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 7

[package]
name = "dbmcp-client"
version = "1.0.11"
description = "Desktop manager for DB MCP Tools"
license = "MIT"
authors = ["khun <khun.mail@qq.com>"]
edition = "2021"
rust-version = "1.96.1"

[lib]
name = "dbmcp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bundled-server = []

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-notification = "=2.8.0"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
toml_edit = { version = "0.23", features = ["serde"] }
sha2 = "0.10"
semver = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tauri-plugin-log = "=2.8.0"
log = "0.4"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
